[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meine-kasse"
version = "1.0.0"
description = "Meine Kasse - einfache Haushaltsbuchhaltung auf Kostenstellen und Konten"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "PySide6>=6.6",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.4",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
meine-kasse = "meine_kasse.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meine_kasse = ["infrastructure/database/migrations/*.ini", "infrastructure/database/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = []

[[tool.mypy.overrides]]
module = ["alembic.*", "reportlab.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/meine_kasse/infrastructure/database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
