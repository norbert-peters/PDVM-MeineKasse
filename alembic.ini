[alembic]
# Nur für die Entwicklung per Kommandozeile (z. B. `alembic revision --autogenerate`).
# Die Anwendung selbst migriert über meine_kasse.infrastructure.database.migrate.
script_location = src/meine_kasse/infrastructure/database/migrations
sqlalchemy.url = sqlite:///data/entwicklung.sqlite

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
